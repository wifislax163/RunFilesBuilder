name: auto openclash arm64 (both ipk & apk)

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0:00（北京时间 8:00）自动检查一次
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制打包（忽略版本检查）'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

jobs:
  check_version:
    name: Check OpenClash Stable Release
    runs-on: ubuntu-22.04
    outputs:
      has_update: ${{ steps.compare_versions.outputs.has_update }}
    
    steps:
      - name: Get latest OpenClash stable release
        id: get_latest_release
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/vernesong/OpenClash/releases/latest)
          TAG_NAME=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // ""')
          IS_PRERELEASE=$(echo "$LATEST_RELEASE" | jq -r '.prerelease // false')
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          
      - name: Get current build version
        id: current_version
        run: |
          CURRENT_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
            jq -r '.tag_name // ""')
          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          
      - name: Compare versions
        id: compare_versions
        run: |
          CURRENT="${{ steps.current_version.outputs.current_tag }}"
          LATEST="${{ steps.get_latest_release.outputs.tag_name }}"
          IS_PRERELEASE="${{ steps.get_latest_release.outputs.is_prerelease }}"
          FORCE="${{ github.event.inputs.force_build }}"
          
          if [ "$FORCE" == "true" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          elif [ "$IS_PRERELEASE" == "true" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
          elif [ -z "$CURRENT" ] || [ "$CURRENT" == "null" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          elif [ -n "$LATEST" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_version
    if: needs.check_version.outputs.has_update == 'true' || github.event.inputs.force_build == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Create directories for IPK and APK
        run: mkdir -p OpenClash openclash-a53-ipk openclash-a53-apk
        
      - name: Checkout package branch to OpenClash directory
        uses: actions/checkout@v4
        with:
          repository: vernesong/OpenClash
          path: OpenClash
          ref: package
          
      - name: Copy latest openclash IPK & APK to respective directories
        run: |
          cp OpenClash/master/*.ipk openclash-a53-ipk/
          cp OpenClash/master/*.apk openclash-a53-apk/

      - name: Get version info
        id: extract_version
        run: |
          first_line=$(head -n 1 OpenClash/master/version | tr -d '\r\n ')
          echo "version=$first_line" >> $GITHUB_ENV

      - name: Create Meta directory for git
        run: mkdir Meta
      
      - name: Checkout core branch to Meta directory
        uses: actions/checkout@v4
        with:
          repository: vernesong/OpenClash
          path: Meta
          ref: core

      - name: Copy latest meta core to both directories
        run: |
          # 复制内核到两个工作目录中
          tar -xzvf Meta/master/meta/clash-linux-arm64.tar.gz -C openclash-a53-ipk
          mv openclash-a53-ipk/clash openclash-a53-ipk/clash_meta
          
          tar -xzvf Meta/master/meta/clash-linux-arm64.tar.gz -C openclash-a53-apk
          mv openclash-a53-apk/clash openclash-a53-apk/clash_meta

      - name: Create install.sh for IPK system (Traditional opkg)
        run: |
          cat << 'EOF' > openclash-a53-ipk/install.sh
          opkg update
          if [ $? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          opkg install *.ipk || exit 1
          mv clash_meta /etc/openclash/core/
          sleep 10s
          ifconfig br-lan > /dev/null 2>&1
          if [ $? -ne 0 ]; then
              echo "接口错误，重启网络。"
              /etc/init.d/network restart
              echo "重启完毕"
              exit 0
          fi
          EOF
          chmod +x openclash-a53-ipk/install.sh

      - name: Create install.sh for APK system (OpenWrt 25.10 apk)
        run: |
          cat << 'EOF' > openclash-a53-apk/install.sh
          apk update
          if [ $? -ne 0 ]; then
              echo "APK update failed."
              exit 1
          fi
          apk add --allow-untrusted *.apk || exit 1
          mkdir -p /etc/openclash/core/
          mv clash_meta /etc/openclash/core/
          sleep 10s
          ifconfig br-lan > /dev/null 2>&1
          if [ $? -ne 0 ]; then
              echo "接口错误，重启网络。"
              /etc/init.d/network restart
              echo "重启完毕"
              exit 0
          fi
          EOF
          chmod +x openclash-a53-apk/install.sh

      - name: Clone makeself repository for self-extracting installer
        run: | 
          git clone https://github.com/megastep/makeself.git

      - name: move openclash directories to makeself & create run files
        run: |
          mv openclash-a53-ipk makeself/
          mv openclash-a53-apk makeself/
          cd makeself
          # 分别打包成两个不同的 .run 文件
          ./makeself.sh openclash-a53-ipk/ openclash-aarch64_cortex-a53-${{ env.version }}.run "by github action" ./install.sh
          ./makeself.sh openclash-a53-apk/ openclash-aarch64_cortex-a53-apk-${{ env.version }}.run "by github action" ./install.sh

      - name: Generate new tag & release and upload
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.version }}
          target_commitish: ${{ github.ref_name }}
          prerelease: false
          name: "OpenClash-Multi-Format-${{ env.version }}"
          body: "![Github](https://img.shields.io/badge/OpenClash_Build-123456?logo=github&logoColor=fff&labelColor=red&style=for-the-badge) [![Github](https://img.shields.io/badge/国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge)](https://wkdaily.cpolar.cn/archives/1)"
          files: makeself/*.run
